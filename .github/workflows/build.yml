# 데스크톱 앱 설치 파일을 macOS와 Windows에서 빌드해 워크플로 아티팩트로 올린다. 손으로 돌리고, Release에는 올리지 않는다.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: stardraft-mac-arm64
          # Intel Mac(x64)은 만들지 않는다. 만들게 되면 Intel 러너 항목을 여기 더하고, mac.target의 arch와 서명 검사의 arm64 경로도 함께 고친다.
          - os: windows-latest
            artifact: stardraft-win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # afterSign 훅이 최상위 번들만 명시 DR로 다시 서명하고, 틀리면 DMG·zip을 만들기 전에 멈춘다.
      - name: 빌드 (macOS)
        if: runner.os == 'macOS'
        run: pnpm dist
      - name: 서명 확인 (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @stardraft/desktop verify:mac

      # 서명 비밀값은 Windows 빌드에만 넘긴다. 등록하지 않았으면 빈 값이라 미서명으로 빌드한다.
      - name: 빌드 (Windows)
        if: runner.os == 'Windows'
        run: pnpm dist
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}

      # Release에 올릴 파일만 담는다. blockmap은 차등 다운로드를 쓰지 않으므로 뺀다.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/latest*.yml
          if-no-files-found: error
