# PR과 main 푸시에서 lint, typecheck, 테스트를 Linux와 Windows에서 돌리고, Linux에서 출시·점검 마법사를 shellcheck로 검사한다.
# pull_request 이벤트는 비밀값을 받지 않는다. 외부인이 연 PR은 저장소 설정에서 승인을 받은 뒤에만 돈다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 출시·점검 마법사(scripts/*.sh). ubuntu 러너에는 shellcheck가 깔려 있다.
      - name: 마법사 검사
        if: runner.os == 'Linux'
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh
