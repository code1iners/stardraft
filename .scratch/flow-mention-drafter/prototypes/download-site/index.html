<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다운로드 사이트 프로토타입</title>
<!--
  PROTOTYPE — 버리는 코드다. 구현에 재사용하지 않는다.
  질문: 다운로드 사이트 화면 프로토타입 (../../issues/19-download-site-prototype.md)
  계획: 다운로드 사이트 변형 3개를 ?variant=A|B|C 로 전환해 비교한다.
    A 문서형        한 페이지 문서. OS 탭 안에 번호 단계, 막히는 곳만 스크린숏, "여기서 막히면" 펼침. 모션 없음.
    B 설치 도우미    다운로드를 누르면 한 단계씩 진행하는 안내가 열린다. "안 돼요"를 누르면 막힌 경우로 갈라진다. 설명용 모션만 쓴다.
    C 미리 해 보기   단계 글을 스크롤하면 옆의 예시 화면(HTML 재현)이 바뀌고, 미리 눌러 볼 수 있다. 실제 스크린숏과 바꿔 볼 수 있다. 장식 모션도 쓴다.
    D 확정안        A·B·C를 본 뒤 사용자가 고른 조합. A의 한 페이지 문서에, 모든 단계마다 C의 예시 화면을 넣는다.
                    막히는 네 곳은 실제 스크린숏을 먼저 보여 주고 예시로 바꿀 수 있다. 첫 화면에 C의 그림을 둔다.
  아래 막대에서 방문 환경(OS·칩·브라우저)과 "동작 줄이기"를 흉내 낼 수 있다. ?env=, ?motion= 으로도 바꾼다.
  실제 사이트는 prefers-reduced-motion 미디어 쿼리를 쓴다. 여기서는 흉내를 위해 html[data-motion]으로 바꾼다.
  데이터(버전, 날짜, 크기, SHA256, 변경 내역)는 모두 가짜다. 다운로드는 일어나지 않는다.
  "실제 스크린숏 자리"는 HTML로 비슷하게 그린 자리 표시다. 실제 사이트에는 첫 릴리스 빌드로 한국어 OS에서 찍은 이미지가 들어간다.
-->
<style>
  :root {
    --bg: #ffffff;
    --bg-2: #f5f6f8;
    --border: #e1e4e8;
    --border-strong: #c6cbd1;
    --text: #1c1f23;
    --muted: #5d646c;
    --accent: #2160c4;
    --accent-hover: #1a52ab;
    --accent-bg: #e8eefa;
    --ok: #1e7438;
    --warn-text: #4d3500;
    --warn-bg: #fdf4de;
    --warn-border: #efd9a2;
    --call: #d9480f;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 var(--font); padding-bottom: 96px; -webkit-text-size-adjust: 100%; }
  a { color: var(--accent); }
  h1 { font-size: 34px; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 22px; line-height: 1.35; margin: 0 0 12px; }
  h3 { font-size: 17px; line-height: 1.45; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  code { font: 0.88em/1.4 var(--mono); background: var(--bg-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; word-break: break-all; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .sp { flex: 1; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .topbar { border-bottom: 1px solid var(--border); }
  .topbar .wrap { display: flex; align-items: center; height: 56px; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: var(--text); text-decoration: none; }
  .topnav { margin-left: auto; display: flex; gap: 20px; font-size: 14px; }
  .topnav a { color: var(--muted); text-decoration: none; cursor: pointer; }
  .topnav a:hover { color: var(--text); }
  .foot { border-top: 1px solid var(--border); margin-top: 48px; padding: 24px 0; font-size: 14px; color: var(--muted); }

  .appicon { display: inline-grid; place-items: center; background: var(--accent); flex: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border-strong); background: #fff; color: var(--text); font: 600 15px/1 var(--font); text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--bg-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.lg { height: 48px; padding: 0 22px; font-size: 16px; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; font-weight: 500; border-radius: 6px; }
  .link { color: var(--accent); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; }
  .link:hover { text-decoration: underline; }

  .lead { font-size: 18px; color: var(--muted); margin: 0 0 22px; max-width: 34em; }
  .dl-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .support { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .other { margin: 6px 0 0; font-size: 14px; }
  .hint { margin: 10px 0 0; font-size: 14px; max-width: 36em; }
  .ver { margin: 18px 0 0; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .note { padding: 12px 14px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--border); font-size: 14px; }
  .note.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
  .dl-msg { font-size: 16px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 12px 0 8px; overflow-x: auto; }
  .tab { border: 0; background: none; padding: 10px 14px; font: 600 15px var(--font); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 0 14px; height: 34px; font: 600 14px var(--font); color: var(--muted); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border-strong); }
  .seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
  .seg.sm button { height: 28px; padding: 0 10px; font-size: 13px; }

  /* 단계 목록 (A, B의 한 번에 보기) */
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps > li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 0 16px; padding: 22px 0; border-top: 1px solid var(--border); }
  .steps > li:first-child { border-top: 0; }
  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: 14px; margin-top: 1px; }
  .quote-line { font-size: 14px; color: var(--muted); }
  .quote-line q { color: var(--text); font-weight: 600; quotes: none; }
  .check { color: var(--ok); font-size: 14px; margin: 10px 0 0; display: flex; gap: 6px; align-items: baseline; }
  details.stuck { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; }
  details.stuck summary { padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
  details.stuck[open] summary { border-bottom: 1px solid var(--border); }
  .qa { margin: 0; padding: 4px 14px 14px; font-size: 15px; }
  .qa dt { font-weight: 600; margin-top: 10px; }
  .qa dd { margin: 2px 0 0; }
  table.states { border-collapse: collapse; font-size: 15px; margin: 6px 0 10px; }
  table.states th, table.states td { text-align: left; padding: 6px 16px 6px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.states th { font-size: 13px; color: var(--muted); font-weight: 600; }

  figure.shot { margin: 14px 0 6px; position: relative; max-width: 560px; }
  figure.shot figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .shot-tag { position: absolute; top: 8px; left: 8px; z-index: 3; font-size: 11px; font-weight: 600; color: var(--muted); background: rgba(255,255,255,.9); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }

  .pre-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .pre-list li { display: grid; gap: 2px; }
  .pre-list li span { color: var(--muted); font-size: 15px; }
  .changes { list-style: none; padding: 0; margin: 0 0 10px; }
  .changes > li { padding: 10px 0; border-top: 1px solid var(--border); }
  .changes > li:first-child { border-top: 0; padding-top: 0; }
  .ch-h { display: flex; gap: 10px; align-items: baseline; }
  .changes ul { margin: 4px 0 0; padding-left: 20px; font-size: 15px; }
  table.files { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0 14px; }
  table.files th, table.files td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.files th { font-size: 13px; color: var(--muted); font-weight: 600; }
  .sha { font: 12px var(--mono); color: var(--muted); margin-right: 6px; }
  .cmd { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .cmd:last-of-type { border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .pathcopy { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  ol.plain { padding-left: 22px; margin: 0 0 12px; }
  ol.plain li { margin: 4px 0; }
  .tbd { font-size: 12px; color: #7a5b00; background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  @media (max-width: 640px) {
    h1 { font-size: 28px; }
    .lead { font-size: 17px; }
    .topnav a:not(.keep) { display: none; }
    .cmd { grid-template-columns: minmax(0, 1fr) auto; }
    .cmd > span { grid-column: 1 / -1; color: var(--muted); }
    table.files thead { display: none; }
    table.files tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    table.files td { border: 0; padding: 0; }
    table.files td:nth-child(3) { grid-column: 1 / -1; }
    .wrap { padding: 0 16px; }
    .steps > li { grid-template-columns: 28px minmax(0, 1fr); gap: 0 10px; }
  }

  /* ---------- A 문서형 ---------- */
  .va .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; }
  .va .toc { position: sticky; top: 0; align-self: start; font-size: 14px; padding-top: 44px; }
  .va .toc a { display: block; padding: 6px 12px; border-left: 2px solid var(--border); color: var(--muted); text-decoration: none; }
  .va .toc a.on { border-left-color: var(--accent); color: var(--text); font-weight: 600; }
  .va main section { padding: 40px 0; border-bottom: 1px solid var(--border); scroll-margin-top: 8px; }
  .va main section:last-child { border-bottom: 0; }
  .va .first .note { margin-top: 20px; max-width: 44em; }
  .va .remove-os + .remove-os { margin-top: 18px; }
  @media (max-width: 860px) { .va .layout { grid-template-columns: 1fr; gap: 0; } .va .toc { display: none; } }

  /* ---------- D 확정안 ---------- */
  .vd .d-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .95fr); gap: 32px; align-items: center; }
  .vd .d-hero .ha-bar .hide-s { display: none; }
  .vd .d-hero .ha-screen:not(.win) .ha-label { right: 60px; }
  .vd .c-inline { display: block; margin: 14px 0 6px; max-width: 600px; }
  .vd .c-inline .stage { position: static; }
  @media (max-width: 1040px) { .vd .d-hero { grid-template-columns: 1fr; gap: 24px; } }

  /* ---------- B 설치 도우미 ---------- */
  .vb .col { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  .vb .hero { padding: 52px 0 28px; }
  .vb .pre { font-size: 14px; color: var(--muted); margin: 14px 0 0; }
  .vb .pre-detail { margin-top: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 8px; }
  .vb .trust { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  .dl-started { padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-2); animation: fadeIn .25s ease-out both; }
  .dl-started p { margin: 0; }
  .wizard { border: 1px solid var(--border-strong); border-radius: 12px; margin: 12px 0 40px; scroll-margin-top: 12px; overflow: hidden; }
  .wiz-head { display: flex; align-items: center; gap: 8px 14px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .wiz-head h2 { margin: 0; font-size: 18px; }
  .wiz-head .count { font-size: 14px; color: var(--muted); }
  .wiz-head .links { display: flex; gap: 14px; font-size: 14px; margin-left: auto; }
  .wiz-prog { display: flex; gap: 4px; padding: 14px 20px 0; }
  .wiz-prog button { flex: 1; height: 6px; border-radius: 3px; background: var(--border); border: 0; padding: 0; cursor: pointer; position: relative; overflow: hidden; }
  .wiz-prog button::before { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .35s ease-out; }
  .wiz-prog button.done::before { transform: scaleX(1); }
  .wiz-prog button.cur::before { transform: scaleX(.5); }
  .wiz-body { padding: 18px 20px 22px; }
  .wiz-body.enter { animation: stepIn .22s ease-out both; }
  .step-k { font-size: 13px; color: var(--accent); font-weight: 700; margin: 0 0 2px; }
  .wiz-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
  .wiz-actions .link { margin-left: 6px; font-size: 14px; }
  .wiz-intro { padding: 18px 20px 22px; }
  .wiz-list { margin: 0 0 16px; padding-left: 22px; }
  .wiz-list li { margin: 3px 0; }
  .stuck-panel { margin-top: 18px; border-top: 1px dashed var(--border-strong); padding-top: 16px; animation: fadeIn .2s ease-out both; }
  .choice { display: block; width: 100%; text-align: left; padding: 11px 14px; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; margin-top: 8px; font: 15px/1.5 var(--font); cursor: pointer; color: var(--text); }
  .choice:hover { border-color: var(--accent); }
  .choice.on { border-color: var(--accent); background: var(--accent-bg); }
  .answer { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); animation: fadeIn .2s ease-out both; }
  .answer.stop { background: #fdecea; border-color: #f3c3bd; color: #6b1a12; }
  .wiz-done { padding: 22px 20px; }
  .wiz-done h3 { font-size: 20px; }
  .vb .steps.in-wiz { padding: 0 20px; }
  .vb .after { margin-bottom: 20px; }
  .vb .after-body { padding: 16px 0; }
  .vb .after-body h3 { margin-top: 14px; }
  .vb .after-body h3:first-child { margin-top: 0; }
  @media (max-width: 640px) {
    .vb .col { padding: 0 16px; }
    .wiz-head, .wiz-prog, .wiz-body, .wiz-intro, .wiz-done { padding-left: 14px; padding-right: 14px; }
    .wiz-head .links { margin-left: 0; width: 100%; }
    .vb .steps.in-wiz { padding: 0 14px; }
  }

  /* ---------- C 미리 해 보기 ---------- */
  .vc .c-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; padding: 56px 0 48px; }
  .vc .c-hero .trust { font-size: 14px; color: var(--muted); margin-top: 14px; max-width: 34em; }
  .vc section + section { border-top: 1px solid var(--border); }
  .vc .c-pre { padding: 32px 0; }
  .vc .c-pre .pre-list { grid-template-columns: 1fr 1fr; gap: 24px; }
  .vc .c-install { padding: 40px 0 8px; scroll-margin-top: 8px; }
  .c-install-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .c-install-head h2 { margin: 0; }
  .scrolly { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 40px; margin-top: 12px; }
  .c-step { min-height: 58vh; padding: 28px 0; opacity: .42; transition: opacity .3s ease; }
  .c-step:last-child { min-height: 70vh; }
  .c-step.on { opacity: 1; }
  .c-inline { display: none; }
  .stage-col { position: relative; }
  .stage { position: sticky; top: 20px; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; background: #fff; }
  .stage-label { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: #5b4300; background: #fbf1d5; border-bottom: 1px solid #ecd9a6; }
  .stage-label.real { color: var(--muted); background: var(--bg-2); border-bottom-color: var(--border); }
  .stage-view { position: relative; padding: 14px; background: repeating-linear-gradient(45deg, #eef0f3 0 10px, #e8ebef 10px 20px); }
  .stage-foot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .stage-cap { margin: 0; font-size: 14px; flex: 1 1 220px; min-height: 22px; }
  .stage-cap.warn { color: #9a2c10; font-weight: 600; }
  .stage-ctl { display: flex; gap: 8px; align-items: center; }
  .cursor { position: absolute; left: 0; top: 0; width: 20px; height: 26px; opacity: 0; pointer-events: none; z-index: 6; transition: transform .9s cubic-bezier(.4, 0, .2, 1), opacity .2s; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
  .vc .c-after { padding: 40px 0 0; }
  .c-after-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; }
  .c-after-grid > div { padding: 24px 0; border-top: 1px solid var(--border); }
  .c-after-grid > div:nth-child(-n+2) { border-top: 0; padding-top: 0; }
  .c-after-grid h3 { margin-top: 12px; font-size: 16px; }

  /* C 첫 화면 그림: 설치하면 아이콘이 생기는 자리 */
  .hero-art { margin: 0; }
  .ha-screen { position: relative; height: 200px; border-radius: 12px; border: 1px solid var(--border); background: #dfe5ec; overflow: hidden; }
  .ha-screen.win { background: #dbe3ed; }
  .ha-bar { position: absolute; left: 0; right: 0; top: 0; height: 46px; display: flex; align-items: center; gap: 18px; padding: 0 18px; background: rgba(250,250,251,.95); border-bottom: 1px solid #d3d8de; font-size: 15px; color: #2b2f33; }
  .ha-screen.win .ha-bar { top: auto; bottom: 0; border-bottom: 0; border-top: 1px solid #d3d8de; }
  .ha-bar .r { margin-left: auto; display: flex; align-items: center; gap: 18px; }
  .ha-ico { width: 18px; height: 14px; border-radius: 3px; background: #9aa1a9; }
  .ha-star { position: relative; display: inline-grid; place-items: center; width: 34px; height: 30px; border-radius: 6px; color: #1d1f22; }
  .ha-star .ring { position: absolute; inset: -6px; border-radius: 10px; border: 2px solid var(--call); animation: ringIn 7s ease-out infinite; }
  .ha-star svg.main { animation: starSpin 7s ease-in-out infinite; }
  .spk { position: absolute; color: #e2a712; animation: twinkle 7s ease-in-out infinite; }
  .spk.k1 { top: -16px; left: -12px; animation-delay: .2s; }
  .spk.k2 { top: -22px; right: -14px; animation-delay: .5s; }
  .spk.k3 { bottom: -16px; right: -18px; animation-delay: .8s; }
  .spk.k4 { bottom: -12px; left: -20px; animation-delay: 1.1s; }
  .ha-screen.win .spk.k3, .ha-screen.win .spk.k4 { display: none; }
  .ha-screen.win .spk.k1 { top: -26px; }
  .ha-screen.win .spk.k2 { top: -30px; }
  .ha-label { position: absolute; font-size: 15px; color: #33383d; display: flex; align-items: center; gap: 8px; animation: fadeHold 7s ease-out infinite; }
  .ha-label::before { content: ""; width: 28px; height: 2px; background: var(--call); }
  .ha-screen:not(.win) .ha-label { top: 88px; right: 120px; }
  .ha-screen.win .ha-label { bottom: 84px; right: 140px; }
  .ha-cap { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

  @media (max-width: 900px) {
    .vc .c-hero { grid-template-columns: 1fr; gap: 28px; padding: 36px 0 32px; }

const params = new URLSearchParams(location.search);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const state = {
  variant: VARIANTS.some(v => v.key === params.get('variant')) ? params.get('variant') : 'D',
  env: ENVS.some(e => e.key === params.get('env')) ? params.get('env') : 'auto',
  motion: ['auto', 'reduce', 'full'].includes(params.get('motion')) ? params.get('motion') : 'auto',
  real: null,
  det: { os: 'mac', chip: 'unknown' },
  guideOs: null,
  // B의 진행 상태. 브라우저에 저장하지만, 저장이 막혀도 동작한다.
  b: Object.assign({ started: false, open: false, step: 0, done: false, all: false, stuck: false, pick: null }, store.get('stardraft-proto-b') || {}),
  bTab: 'update',
  bPre: false,
  c: { active: 0, real: {}, phase: {}, cap: {}, curPos: {} },
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduced = () => state.motion === 'reduce' || (state.motion === 'auto' && matchMedia('(prefers-reduced-motion: reduce)').matches);
const isWide = () => matchMedia('(min-width: 901px)').matches;
const guideOs = () => state.guideOs || (state.det.os === 'win' ? 'win' : 'mac');
const dlPath = os => os === 'mac' ? '/download/mac' : '/download/windows';

// 실제 사이트가 쓸 감지 방식. Chromium만 칩을 알려 준다.
async function detectReal() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|Android|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua))) return { os: 'mobile' };
  const uad = navigator.userAgentData;
  const p = (uad && uad.platform) || ua;
  const os = /mac/i.test(p) ? 'mac' : /win/i.test(p) ? 'win' : 'other';
  let chip = 'unknown';
  if (uad && uad.getHighEntropyValues) {
    try {
      const v = await uad.getHighEntropyValues(['architecture']);
      chip = v.architecture === 'arm' ? 'arm' : v.architecture === 'x86' ? 'x86' : 'unknown';
    } catch {}
  }
  return { os, chip };
}

function mountA() {

}

    case 'b-state':
      if (el.dataset.go === 'stop') { b.stuck = true; $('#b-guide').innerHTML = wizard(); }
      else { b.step++; rerenderWizard(); }
      break;
    case 'b-reset': Object.assign(b, { started: false, open: false, step: 0, done: false, all: false, stuck: false, pick: null }); saveB(); render(); window.scrollTo(0, 0); break;
    case 'b-tab': state.bTab = el.dataset.tab; $('#b-after').innerHTML = afterB(); if (el.closest('#b-guide')) scrollToEl($('#b-after')); break;
    case 'c-real': { state.c.real[el.dataset.id] = el.dataset.v === '1'; const box = el.closest('[data-inline]'); renderStage(box ? +box.dataset.inline : state.c.active); break; }
    case 'c-replay': {
      const i = +el.dataset.i, s = STEPS[guideOs()][i];
      delete state.c.phase[s.scene]; delete state.c.cap[s.scene]; state.c.curPos = {}; renderStage(i); break;
    }
    case 'c-next': scrollToEl($(`.c-step[data-ci="${+el.dataset.i + 1}"]`)); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
$$('#proto [data-proto]').forEach(btn => btn.addEventListener('click', () => cycle(btn.dataset.proto === 'next' ? 1 : -1)));
const envSel = $('#proto-env');
envSel.innerHTML = ENVS.map(x => `<option value="${x.key}">${x.label}</option>`).join('');
envSel.value = state.env;
envSel.addEventListener('change', async () => { state.env = envSel.value; state.c.active = 0; state.c.curPos = {}; await applyEnv(); syncUrl(); render(); });
const motionSel = $('#proto-motion');
motionSel.value = state.motion;
motionSel.addEventListener('change', () => { state.motion = motionSel.value; syncUrl(); const y = window.scrollY; render(); window.scrollTo(0, y); });
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => { if (state.motion === 'auto') render(); });
matchMedia('(min-width: 901px)').addEventListener('change', () => { if (state.variant === 'C') render(); });

(async () => {
  state.real = await detectReal();
  await applyEnv();
  syncUrl();
  render();
})();
</script>
</body>
</html>
