<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>검토 화면(가짜)</title>
    <style>
      body { font: 14px -apple-system, sans-serif; margin: 24px; }
      p { margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <p><strong>검토 화면(가짜)</strong></p>
    <p id="reason"></p>
    <script>
      /** 창을 연 이유. 알림 클릭인지 트레이 메뉴인지 구분한다. */
      const reason = new URLSearchParams(location.search).get('reason') ?? '알 수 없음';
      document.getElementById('reason').textContent = `열린 이유: ${reason}`;
    </script>
  </body>
</html>
