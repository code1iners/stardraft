<template><style>#root{position:absolute;inset:0;pointer-events:none;}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div id="caption-question-1" class="clip caption" data-start="0.5" data-duration="3.591" data-track-index="2"><div class="beat-content"><p>동료가 비밀번호 재설정 링크의 유효 시간을 물었습니다.</p></div></div><div id="caption-question-2" class="clip caption" data-start="4.291" data-duration="5.288" data-track-index="2"><div class="beat-content"><p>Stardraft에서 코드에 근거한 초안을 만들고, 직접 검토해 게시해 보겠습니다.</p></div></div><div id="caption-open-1" class="clip caption" data-start="10.5" data-duration="3.693" data-track-index="2"><div class="beat-content"><p>설치한 앱을 켜고, 맥 메뉴 막대의 별 아이콘을 누릅니다.</p></div></div><div id="caption-open-2" class="clip caption" data-start="14.393" data-duration="3.297" data-track-index="2"><div class="beat-content"><p>설정 열기에서 처음 필요한 세 가지를 연결합니다.</p></div></div><div id="caption-prepare-1" class="clip caption" data-start="18.5" data-duration="4.559" data-track-index="2"><div class="beat-content"><p>Flow 개인 API 키, 로그인된 로컬 에이전트, 그리고 코드 저장소가 필요합니다.</p></div></div><div id="caption-prepare-2" class="clip caption" data-start="23.259" data-duration="2.424" data-track-index="2"><div class="beat-content"><p>키 발급과 에이전트 설치는 미리 마쳐 주세요.</p></div></div><div id="caption-flow-1" class="clip caption" data-start="26.5" data-duration="3.636" data-track-index="2"><div class="beat-content"><p>Flow 계정에 내 개인 키를 붙여 넣고, 확인을 누릅니다.</p></div></div><div id="caption-flow-2" class="clip caption" data-start="30.336" data-duration="3.358" data-track-index="2"><div class="beat-content"><p>연결된 이름과 소속이 내 계정인지 확인하세요.</p></div></div><div id="caption-agent-1" class="clip caption" data-start="34.5" data-duration="3.402" data-track-index="2"><div class="beat-content"><p>에이전트에서는 찾기, 버전, 로그인, 작동 확인이 진행됩니다.</p></div></div><div id="caption-agent-2" class="clip caption" data-start="38.102" data-duration="3.59" data-track-index="2"><div class="beat-content"><p>작동 확인은 실제 사용량을 조금 씁니다. Codex도 선택할 수 있습니다.</p></div></div><div id="caption-folders-1" class="clip caption" data-start="42.5" data-duration="3.814" data-track-index="2"><div class="beat-content"><p>저장소에서 폴더 추가를 누르고, 코드 저장소가 모인 상위 폴더를 고릅니다.</p></div></div><div id="caption-folders-2" class="clip caption" data-start="46.514" data-duration="3.169" data-track-index="2"><div class="beat-content"><p>연결이 없는 멘션은 여기서 찾은 저장소를 바탕으로 처리합니다.</p></div></div><div id="caption-start-1" class="clip caption" data-start="50.5" data-duration="3.163" data-track-index="2"><div class="beat-content"><p>필수 설정을 마쳤다면 감지 시작을 누릅니다.</p></div></div><div id="caption-start-2" class="clip caption" data-start="53.863" data-duration="5.289" data-track-index="2"><div class="beat-content"><p>이때부터 새 업무 멘션을 감지합니다. 과거 멘션을 자동으로 가져오지는 않습니다.</p></div></div><div id="caption-mention-1" class="clip caption" data-start="60.5" data-duration="3.464" data-track-index="2"><div class="beat-content"><p>동료가 업무 댓글에서 나를 직접 지목해 질문합니다.</p></div></div><div id="caption-mention-2" class="clip caption" data-start="64.163" data-duration="5.12" data-track-index="2"><div class="beat-content"><p>채팅이나 담당자 지정이 아닌, 나를 직접 지목한 새 업무 멘션이 대상입니다.</p></div></div><div id="caption-generation-1" class="clip caption" data-start="70.5" data-duration="4.477" data-track-index="2"><div class="beat-content"><p>연결된 저장소가 없으면 작업 폴더에서 적절한 저장소를 고릅니다.</p></div></div><div id="caption-generation-2" class="clip caption" data-start="75.177" data-duration="4.517" data-track-index="2"><div class="beat-content"><p>로컬 에이전트가 관련 코드를 읽고, 멘션에 답할 초안을 만듭니다.</p></div></div><div id="caption-review-1" class="clip caption" data-start="80.5" data-duration="3.989" data-track-index="2"><div class="beat-content"><p>알림이나 별 아이콘의 숫자로 초안이 준비된 것을 알 수 있습니다.</p></div></div><div id="caption-review-2" class="clip caption" data-start="84.689" data-duration="4.847" data-track-index="2"><div class="beat-content"><p>열린 화면에서 원문과 에이전트가 이해한 요구, 답변 초안을 비교합니다.</p></div></div><div id="caption-evidence-1" class="clip caption" data-start="90.5" data-duration="4.995" data-track-index="2"><div class="beat-content"><p>초안 문장 옆의 근거 번호를 누르면, 설명과 파일 위치를 확인할 수 있습니다.</p></div></div><div id="caption-evidence-2" class="clip caption" data-start="95.695" data-duration="4.511" data-track-index="2"><div class="beat-content"><p>이 예제에서는 링크가 30분 동안 유효하다는 코드 근거를 확인합니다.</p></div></div><div id="caption-edit-1" class="clip caption" data-start="102.5" data-duration="5.184" data-track-index="2"><div class="beat-content"><p>문장을 눌러 동료에게 보낼 표현으로 직접 수정하고, 받는 사람도 확인합니다.</p></div></div><div id="caption-edit-2" class="clip caption" data-start="107.884" data-duration="5.137" data-track-index="2"><div class="beat-content"><p>편집하면 초안의 근거 번호는 숨겨집니다. 근거 확인을 먼저 마쳐 두세요.</p></div></div><div id="caption-post-1" class="clip caption" data-start="114.5" data-duration="2.247" data-track-index="2"><div class="beat-content"><p>내용이 맞으면 게시를 누릅니다.</p></div></div><div id="caption-post-2" class="clip caption" data-start="116.947" data-duration="5.301" data-track-index="2"><div class="beat-content"><p>5초 동안은 취소할 수 있습니다. 시간이 지나면 내 이름으로 Flow에 게시됩니다.</p></div></div><div id="caption-posted-1" class="clip caption" data-start="125.5" data-duration="4.199" data-track-index="2"><div class="beat-content"><p>게시되는 것은 답변 본문이며, 코드 근거는 포함되지 않습니다.</p></div></div><div id="caption-trial-1" class="clip caption" data-start="130.5" data-duration="4.649" data-track-index="2"><div class="beat-content"><p>새 멘션을 기다리지 않고 연습하려면, 최근 멘션으로 시험을 누르세요.</p></div></div><div id="caption-trial-2" class="clip caption" data-start="135.349" data-duration="5.753" data-track-index="2"><div class="beat-content"><p>실제 에이전트 사용량은 쓰지만 Flow에는 게시하지 않습니다. 시험 끝내기로 마칩니다.</p></div></div><div id="caption-finish-1" class="clip caption" data-start="142.5" data-duration="4.228" data-track-index="2"><div class="beat-content"><p>설정을 마치고, 근거를 확인하고, 내 답변으로 다듬어 게시하세요.</p></div></div><div id="caption-finish-2" class="clip caption" data-start="146.928" data-duration="2.76" data-track-index="2"><div class="beat-content"><p>지금은 최근 멘션으로 시험부터 시작해 보세요.</p></div></div></div><script>/** 자막 표시 구간은 명시적인 clip 속성으로 관리한다. */window.__timelines.captions=gsap.timeline({paused:true});</script></template>
