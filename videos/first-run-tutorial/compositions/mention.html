<template><style>#root{position:absolute;inset:0;}</style><div id="root" data-composition-id="mention" data-width="1920" data-height="1080"><div class="scene-background"></div><div class="scene-content"><h1 data-var-text="mention-title">동료가 새 업무 멘션을 보냅니다</h1><div class="flow-message"><div class="flow-heading">Flow 업무 댓글 · 재현 예시</div><div class="flow-author"><span class="avatar">지</span><div><b>이지원</b><small>계정 서비스 / 비밀번호 재설정 안내</small></div></div><p class="flow-text"><span>@김민수</span><br>비밀번호 재설정 링크의<br>유효 시간이 얼마인가요?</p><p class="example">감지 시작 이후에 들어온 새 업무 멘션</p></div></div></div><script>/** 이 장면의 결정적 모션 타임라인. */const tl=gsap.timeline({paused:true});tl.fromTo('.scene-content h1',{opacity:0},{opacity:1,duration:0.22},0);tl.fromTo('.flow-text',{x:45,opacity:0},{x:0,opacity:1,duration:0.6,ease:'power4.out'},1.2);/** 클릭은 커서가 도착한 뒤 한 번만 발생한다. */document.querySelectorAll('.pointer-track').forEach((el)=>{const at=Number(el.dataset.start);tl.fromTo(el.querySelector('.pointer'),{x:95,y:75,opacity:0},{x:0,y:0,opacity:1,duration:0.65,ease:'power2.inOut'},at);tl.fromTo(el.querySelector('.click-ring'),{scale:0.35,opacity:0.8},{scale:1.5,opacity:0,duration:0.45,ease:'power2.out'},at+0.75);});window.__timelines['mention']=tl;</script></template>
